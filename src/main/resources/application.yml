spring:
  application:
    name: retrieval-service
  reactor:
    context-propagation: auto
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/retrieval}
    username: ${POSTGRES_USER:retrieval}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  # The schema is migrated by ModuleSchemaMigrator, as in the monolith, so the history that comes with the data is
  # the same one (specs/LAB-129).
  flyway:
    enabled: false
  webflux:
    multipart:
      max-in-memory-size: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_PART_SIZE:11MB}
      max-disk-usage-per-part: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_PART_SIZE:11MB}
      max-parts: 4
  ai:
    # Embeddings go through the LiteLLM gateway (LAB-84) with the service's own virtual key.
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:http://localhost:4000/v1}
      api-key: ${SPRING_AI_OPENAI_API_KEY:sk-shoplab-retrieval-local}
      max-retries: 0
      timeout: ${SHOPLAB_RETRIEVAL_GATEWAY_REQUEST_TIMEOUT:60s}
      embedding:
        model: embeddings

server:
  port: 8080
  shutdown: graceful
  netty:
    # The search travels in the query string and the chat can compose 4000 characters plus earlier questions: up to
    # tens of KB once encoded, and Netty accepts 4 KB by default (specs/LAB-129, research D-7).
    max-initial-line-length: 64KB

shoplab:
  retrieval:
    ingest:
      base-url: ${SHOPLAB_RETRIEVAL_INGEST_BASE_URL:http://localhost:8000}
      timeout: ${SHOPLAB_RETRIEVAL_INGEST_TIMEOUT:30s}
      max-response-bytes: ${SHOPLAB_RETRIEVAL_INGEST_MAX_RESPONSE_BYTES:33554432}
    upload:
      # Largest document accepted by POST /api/documents; the same 10 MiB as the ingest service.
      max-bytes: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_BYTES:10485760}
    embedding:
      # Name of the real model behind `embeddings`; it is stored with each vector (ADR-0017).
      model-name: ${SHOPLAB_RETRIEVAL_EMBEDDING_MODEL_NAME:bge-m3}
      batch-size: ${SHOPLAB_RETRIEVAL_EMBEDDING_BATCH_SIZE:16}
      search-limit: ${SHOPLAB_RETRIEVAL_EMBEDDING_SEARCH_LIMIT:5}
      auto-index: ${SHOPLAB_RETRIEVAL_EMBEDDING_AUTO_INDEX:true}
      reindex-on-startup: ${SHOPLAB_RETRIEVAL_EMBEDDING_REINDEX_ON_STARTUP:false}

# No authentication until there is a login (LAB-61, ADR-0024).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: logstash
